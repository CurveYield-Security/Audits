name: Publish Boosthub linked audit PDF

on:
  push:
    paths:
      - ".github/scripts/build_boosthub_public_pdf.py"
      - ".github/workflows/publish-boosthub-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public releases repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF generation dependencies
        run: python -m pip install --disable-pip-version-check "PyMuPDF==1.26.5" "reportlab==4.4.4"
      - name: Build report with validated release-local hyperlinks
        run: python .github/scripts/build_boosthub_public_pdf.py
      - name: Publish exactly one PDF into the dedicated release folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Boosthub Staking v2 - Linked Public Release/CurveYield_Boosthub_Staking_v2_Linked_Security_Audit.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Publish linked Boosthub Staking v2 audit PDF"
            git push
          fi
